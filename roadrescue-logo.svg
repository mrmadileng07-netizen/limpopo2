<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 100" role="img" aria-labelledby="title desc">
  <title id="title">RoadRescue SA logo</title>
  <desc id="desc">Shield badge with road and sun to represent roadside emergency assistance for Limpopo communities.</desc>

  <defs>
    <linearGradient id="sunGlow" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#FFD15C"/>
      <stop offset="100%" stop-color="#FF9F1C"/>
    </linearGradient>
  </defs>

  <!-- Shield badge -->
  <g transform="translate(12 8)">
    <path d="M60 0 L96 12 V48 C96 71 78 86 60 94 C42 86 24 71 24 48 V12 L60 0 Z" fill="#102A43"/>
    <path d="M60 12 L82 19 V46 C82 61 71 73 60 80 C49 73 38 61 38 46 V19 L60 12 Z" fill="#173E63"/>

    <!-- Road -->
    <path d="M43 28 L60 60 L78 60" fill="none" stroke="#F7F9FC" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M47 38 L60 58" fill="none" stroke="#FFD15C" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 8"/>

    <!-- Sun accent -->
    <circle cx="78" cy="20" r="10" fill="url(#sunGlow)"/>
    <circle cx="78" cy="20" r="3" fill="#FFF7D6"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(130 29)">
    <text x="0" y="22" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="800" fill="#102A43" letter-spacing="-0.5">RoadRescue</text>
    <text x="0" y="52" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#FF9F1C" letter-spacing="2">SA</text>
    <text x="54" y="52" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#6B7A8A" letter-spacing="2">LIMPOPO EDITION</text>
  </g>
</svg>
